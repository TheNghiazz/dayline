name: Dayline

options:
  bundleIdPrefix: com.ngia
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Dayline:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngia.dayline
        PRODUCT_NAME: Dayline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: Dayline
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations: [vi, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
    entitlements:
      path: Support/Dayline.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ngia.dayline
    dependencies:
      - target: DaylineWidgets
        embed: true

  DaylineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngia.dayline.widgets
        PRODUCT_NAME: DaylineWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: Dayline
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/DaylineWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ngia.dayline

  DaylineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngia.dayline.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Dayline

schemes:
  Dayline:
    build:
      targets:
        Dayline: all
        DaylineWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: DaylineTests
