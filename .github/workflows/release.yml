name: release-ipa

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Dayline.xcodeproj \
            -scheme Dayline \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verify app + widget
        run: |
          APP="build/Build/Products/Release-iphoneos/Dayline.app"
          test -d "$APP" || { echo "::error::Dayline.app not found"; exit 1; }
          test -d "$APP/PlugIns/DaylineWidgets.appex" || { echo "::error::Widget extension not embedded"; exit 1; }
          echo "App size: $(du -sh "$APP" | cut -f1)"

      - name: Package IPA
        run: |
          rm -rf Payload Dayline.ipa
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Dayline.app" "Payload/"
          zip -qry Dayline.ipa Payload
          shasum -a 256 Dayline.ipa | tee Dayline.ipa.sha256
          ls -lh Dayline.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dayline-ipa
          path: |
            Dayline.ipa
            Dayline.ipa.sha256
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Dayline.ipa
            Dayline.ipa.sha256
