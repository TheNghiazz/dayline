</button>

<script>
  // Micro-interaction for Duration Chips selection
  const durationButtons = document.querySelectorAll('#duration-chips button');
  const durationDisplay = document.getElementById('duration-display');

  const durationEndTimes = {
    '15': 'Kết thúc: 14:45',
    '30': 'Kết thúc: 15:00',
    '45': 'Kết thúc: 15:15',
    '60': 'Kết thúc: 15:30'
  };

  durationButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      durationButtons.forEach((b) => {
        b.className = 'h-9 rounded-lg bg-surface-container text-on-surface-variant font-meta text-meta font-medium hover:bg-surface-container-high transition-colors';
      });
      btn.className = 'h-9 rounded-lg bg-primary-container text-on-primary font-meta text-meta font-semibold shadow-sm transition-all';
      
      const val = btn.getAttribute('data-val');
      if (durationEndTimes[val]) {
        durationDisplay.textContent = durationEndTimes[val];
      }
    });
  });

  // Haptic-like button visual pulse
  const saveBtn = document.getElementById('btn-save');
  saveBtn.addEventListener('click', () => {
    saveBtn.classList.add('scale-[0.97]');
    setTimeout(() => {
      saveBtn.classList.remove('scale-[0.97]');
    }, 150);
  });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-background/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.03)]" data-active-classes="text-primary-container font-semibold"><div class="h-[49px] flex items-center justify-around px-gutter"><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-[2px] text-secondary hover:text-on-surface transition-colors duration-200" data-path="hom-nay" href="#"><span class="material-symbols-outlined text-[22px]">wb_sunny</span><span class="font-meta text-[11px] leading-tight">Hôm nay</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-[2px] text-secondary hover:text-on-surface transition-colors duration-200" data-path="ghi-chu" href="#"><span class="material-symbols-outlined text-[22px]">edit_note</span><span class="font-meta text-[11px] leading-tight">Ghi chú</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-[2px] text-secondary hover:text-on-surface transition-colors duration-200" data-path="thong-ke" href="#"><span class="material-symbols-outlined text-[22px]">pie_chart</span><span class="font-meta text-[11px] leading-tight">Thống kê</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-[2px] text-secondary hover:text-on-surface transition-colors duration-200" data-path="cai-dat" href="#"><span class="material-symbols-outlined text-[22px]">settings</span><span class="font-meta text-[11px] leading-tight">Cài đặt</span></a></div></nav></body></html>
